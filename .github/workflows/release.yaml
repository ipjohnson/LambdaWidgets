name: release

# A v* tag is the whole trigger, and the tag is the version. Nothing in the repository carries a
# version number, so there is no second place for one to be wrong.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # One job per runner architecture, because ahead-of-time compilation does not cross-compile: ILC
  # emits native code for the machine it runs on, and a linux-arm64 binary needs a linux-arm64
  # runner. This is the reason distribution is a matrix rather than one publish with five -r flags.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-latest
            rid: osx-arm64
          - runner: macos-13
            rid: osx-x64
          - runner: windows-latest
            rid: win-x64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/LambdaWidgets.Harness \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:TrimmerSingleWarn=false \
            --output publish/${{ matrix.rid }}

      # The binary is the deliverable, so it has to start. A publish that succeeded and a binary
      # that cannot reach its own static content are the same green check, and only this tells them
      # apart.
      - name: It runs
        shell: bash
        run: |
          echo '{"widgets":[]}' > empty.json
          BIN=publish/${{ matrix.rid }}/lambda-widgets
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          PORT=5085 "$BIN" --dashboard empty.json &
          sleep 5
          curl --fail --silent --max-time 20 http://localhost:5085/ > /dev/null

      - name: Package
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          # The binary and nothing else. Static content is embedded, and a folder of loose files is
          # a worse thing to hand someone than one executable.
          if [ -f lambda-widgets.exe ]; then
            7z a ../../lambda-widgets-${{ matrix.rid }}.zip lambda-widgets.exe
          else
            tar czf ../../lambda-widgets-${{ matrix.rid }}.tar.gz lambda-widgets
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-widgets-${{ matrix.rid }}
          path: lambda-widgets-${{ matrix.rid }}.*

  packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The tag is the version, with the leading v removed. A package version set anywhere else
      # would be a second place for it to disagree with the tag that produced it.
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Named, not globbed. A packable project silently dropped from a glob ships a release missing
      # that package, which is a failure nobody notices until a consumer restores.
      - name: Pack
        run: |
          for project in \
            src/LambdaWidgets.Dashboard/LambdaWidgets.Dashboard.csproj \
            src/LambdaWidgets.Runtime/LambdaWidgets.Runtime.csproj \
            src/LambdaWidgets.Charts/LambdaWidgets.Charts.csproj \
            src/LambdaWidgets.Testing/LambdaWidgets.Testing.csproj \
            src/LambdaWidgets.Harness/LambdaWidgets.Harness.csproj \
            templates/LambdaWidgets.Templates.csproj
          do
            dotnet pack "$project" --configuration Release \
              -p:Version=${{ steps.version.outputs.version }} \
              -p:ContinuousIntegrationBuild=true \
              --output packages
          done

      # Six, and the count is a literal on purpose. A project that stops packing - IsPackable
      # flipped, a rename - otherwise ships a release short one package and says nothing.
      - name: Six packages
        run: |
          COUNT=$(ls packages/*.nupkg | wc -l)
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::Packed $COUNT packages, expected 6. Update this workflow if one was added or removed."
            ls packages/
            exit 1
          fi

      # The harness ships as a dotnet tool as well as a native binary, and the two are packaged by
      # different steps. The binaries job proves its binary starts; nothing proved the tool did
      # until this, and a tool that installs and cannot serve is the same green release.
      - name: The tool runs
        run: |
          echo '{"widgets":[]}' > empty.json
          dotnet tool install --tool-path tool --add-source packages \
            --version ${{ steps.version.outputs.version }} LambdaWidgets.Harness
          PORT=5086 tool/lambda-widgets --dashboard empty.json &
          sleep 10
          curl --fail --silent --max-time 20 http://localhost:5086/ > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.nupkg

  # The README tells people to docker run this, so a release that does not build it is a release
  # that breaks the first thing on the page. ghcr.io takes the built-in token, so no secret.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The Dockerfile compiles the harness ahead of time inside the build stage, so this is one
      # architecture per runner the same way the binaries are. amd64 only for now: an arm64 image
      # needs an arm64 runner, not emulation, because ILC does not cross-compile.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lambda-widgets:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/lambda-widgets:latest

      # The same check the binaries get, for the same reason: an image that builds and cannot serve
      # is the same green release.
      - name: The image runs
        run: |
          echo '{"widgets":[]}' > empty.json
          docker run --rm --detach --name harness -p 5087:5080 \
            --volume "$PWD/empty.json:/dashboard.json" \
            ghcr.io/${{ github.repository_owner }}/lambda-widgets:${{ github.ref_name }}
          sleep 10
          curl --fail --silent --max-time 20 http://localhost:5087/ > /dev/null
          docker stop harness

  publish:
    needs: [binaries, packages, image]
    runs-on: ubuntu-latest

    # At the job rather than on the step that uses it. A step's own env block is not in scope for
    # that step's if, so gating on it there skips the push every time, secret or no secret - a
    # release that builds everything, tags it, and quietly publishes nothing.
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*/lambda-widgets-*.tar.gz \
            artifacts/*/lambda-widgets-*.zip

      # Last, and only once the binaries are built and the release exists. A package on nuget.org
      # cannot be unpublished, so it is the step with no way back and it goes after every step that
      # can still fail.
      - name: nuget.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
