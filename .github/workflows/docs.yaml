name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yaml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yaml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a running one finish. Cancelling mid-deploy can leave Pages
# serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated in the theme config reads git history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # VitePress fails the build on a dead internal link, so this job is the link check as well.
      - run: npm run docs:build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
